# Local development catalog for `subako-core release`. Mirrors the shape of
# infra/deployments/*/catalog.yaml in the backend repo, with a mock upstream.
plans:
  - slug: default
    display_name: Local
    description: Local development. No billing.

identity:
  issuer: http://127.0.0.1:8081/dev
  client_id: subako-dev

# The mock model testbed/up.sh starts. Its key is SUBAKO_PROVIDER_KEY_ANTHROPIC.
upstreams:
  - slug: anthropic
    format: anthropic
    # CODESYNC(testbed-mock-anthropic-port)
    base_url: http://127.0.0.1:9797

providers:
  - slug: anthropic
    display_name: Mock Anthropic
    format: anthropic
    models:
      - slug: claude-sonnet-4-5-20250929
        upstream: anthropic
        model: claude-sonnet-4-5-20250929

rates:
  models:
    - provider: anthropic
      model: claude-sonnet-4-5-20250929
      format: anthropic
      sc_per_million_tokens:
        input: "1"
        cache_write: "1"
        cache_read: "1"
        output: "1"
  harness:
    pi: "0.00000001"
  function:
    standard: "0.00000001"
  volume:
    write: "0.00000001"
  storage:
    volume: "0.00000001"
